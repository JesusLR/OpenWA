# Existing-server deployment: use with docker-compose.yml and .env.server.
# PostgreSQL is an existing container; do not enable the postgres/full profiles.
services:
  openwa-api:
    environment:
      NODE_ENV: production
      SERVE_DASHBOARD: 'true'
      ALLOW_DEV_API_KEY: 'false'
      DATABASE_TYPE: postgres
      DATABASE_HOST: ${DATABASE_HOST:-openwa-postgres}
      DATABASE_PORT: '5432'
      DATABASE_NAME: ${DATABASE_NAME:?Set the existing PostgreSQL database name in .env.server}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set the existing PostgreSQL user in .env.server}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set the existing PostgreSQL password in .env.server}

volumes:
  openwa-data:
    name: ${OPENWA_DATA_VOLUME:?Set the existing API data volume name in .env.server}

networks:
  openwa-network:
    external: true
    name: openwa-network
